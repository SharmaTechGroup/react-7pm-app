<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function GetCode(e){
            console.log(`Key Code : ${e.keyCode}\nChar Code: ${e.charCode}`);
        }
    </script>
</head>
<body>
    <input type="text" onkeypress="GetCode(event)">
</body>
</html>
